# Intermediario gratuito en Cloudflare Workers.
# Los secretos NO van aquí: se cargan con
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ACCESS_TOKEN
name = "jarvis"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Solo esta página puede usar el intermediario (tu GitHub Pages).
ALLOWED_ORIGIN = "https://trabajodiegonahue-droid.github.io"
# El modelo lo decide el intermediario, no el teléfono (así nadie puede pedir uno de pago).
GEMINI_MODEL = "gemini-flash-lite-latest"
# Clave pública de los avisos (ver abajo). No es secreta.
# VAPID_PUBLIC = "pega-aqui-la-clave-publica"

# Buzón para el Atajo de Siri (opcional, gratis): lo que dictas para anotar queda aquí
# hasta que abres la app. Para activarlo:
#   1. npx wrangler kv namespace create BUZON
#   2. Copia el "id" que te muestra y descomenta estas tres líneas:
# [[kv_namespaces]]
# binding = "BUZON"
# id = "pega-aqui-el-id"

# Avisos en el iPhone (opcional, gratis). Necesitan el buzón de arriba y un par de claves:
#   node scripts/claves-avisos.mjs
#   npx wrangler secret put VAPID_PRIVATE
# Después pega la clave pública en VAPID_PUBLIC (arriba, en [vars]) y descomenta el reloj que revisa los avisos cada 5 minutos:
# [triggers]
# crons = ["*/5 * * * *"]
